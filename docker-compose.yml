version: '3.8'
services:
  db2:
    container_name: db2
    image: icr.io/db2_community/db2
    privileged: true             # Required for memory management
    restart: always
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=your_password
      - DBNAME=FIN_DB            # Auto-creates the DB with correct name length
      - PERSISTENT_HOME=false    # Fixes Windows 'Permission Denied' on sqllib
    ports:
      - "50000:50000"
    volumes:
      - ./db2_data:/database     # Persists your FIN_DB data only
